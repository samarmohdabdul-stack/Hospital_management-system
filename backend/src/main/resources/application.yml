server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hospital-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com,https://*.railway.app}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.hospital: DEBUG
    org.springframework.security: INFO
